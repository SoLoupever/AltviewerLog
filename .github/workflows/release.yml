name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

        - name: WoW Packager
          uses: BigWigsMods/packager@v2.6.1
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}